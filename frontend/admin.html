<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>用户管理后台 · AIS</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/account.css?v=20261014-1"><script defer src="/static/session.js?v=20261014-1"></script><script defer src="/static/admin.js?v=20261014-1"></script></head>
<body class="admin-page">
  <header class="admin-header"><div class="account-brand"><span class="brand-symbol">A</span><div>AIS 用户管理平台<p>SUPER ADMINISTRATION</p></div></div><div class="admin-header-actions"><span id="adminIdentity"></span><a class="account-button" href="/">分析工作台 ↗</a><a class="account-button" href="/account/password">修改密码</a><button id="adminLogout" class="account-button">退出登录</button></div></header>
  <main class="admin-main">
    <div class="admin-intro"><div><h1>用户与访问管理</h1><p class="secondary">管理账号权限，查看登录记录与当前会话。</p></div><button id="createUserBtn" class="account-button primary">＋ 创建用户</button></div>
    <div class="admin-metrics"><article class="admin-metric"><span>全部用户</span><strong id="totalUsers">—</strong></article><article class="admin-metric"><span>启用账号</span><strong id="enabledUsers">—</strong></article><article class="admin-metric"><span>超级管理员</span><strong id="superAdmins">—</strong></article><article class="admin-metric"><span>历史数据文件</span><strong id="totalDatasets">—</strong></article></div>
    <p id="adminStatus" class="admin-status" role="status"></p>
    <section class="admin-panel" aria-label="用户管理">
      <div class="admin-tabs" role="tablist" aria-label="管理内容"><button class="admin-tab" role="tab" aria-selected="true" data-tab="users">用户账号</button><button class="admin-tab" role="tab" aria-selected="false" data-tab="login">登录记录</button><button class="admin-tab" role="tab" aria-selected="false" data-tab="access">访问记录</button><button class="admin-tab" role="tab" aria-selected="false" data-tab="sessions">有效会话</button><button class="admin-tab" role="tab" aria-selected="false" data-tab="audit">管理操作记录</button></div>
      <div class="admin-toolbar"><div><input id="userSearch" type="search" placeholder="搜索账号或显示名称" aria-label="搜索用户"><select id="logUserFilter" aria-label="筛选用户" hidden><option value="">全部用户</option></select></div><div class="admin-actions"><p id="recordCount"></p><button id="adminRefresh" class="account-button">刷新</button></div></div>
      <div class="table-scroll"><table class="admin-table"><thead id="adminTableHead"></thead><tbody id="adminTableBody"><tr><td class="admin-empty">正在读取用户信息…</td></tr></tbody></table></div>
      <div id="adminPagination" class="admin-pagination" hidden><button id="previousPage" class="account-button">上一页</button><span id="pageDescription"></span><button id="nextPage" class="account-button">下一页</button></div>
    </section>
    <p class="admin-footnote">时间按北京时间显示。密码以哈希形式保存，账号管理通过重置密码完成。重置密码、禁用账号和调整角色会结束该账号已有的登录会话。有效会话表示尚未退出且未过期的登录，最近活动时间每 30 秒更新一次。</p>
  </main>
  <dialog id="userDialog" class="account-dialog"><h2 id="userDialogTitle">创建用户</h2><p id="userDialogHint" class="secondary">新用户第一次登录时需要修改临时密码。</p><form id="userForm"><label id="editUsernameField">账号<input id="editUsername" autocomplete="off" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" required></label><label>显示名称<input id="editDisplayName" maxlength="80"></label><label id="editPasswordField">临时密码<input id="editPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="至少 10 个字符"></label><label>账号角色<select id="editRole"><option value="user">普通用户</option><option value="superadmin">超级管理员</option></select></label><label id="editEnabledField" class="checkbox-label" hidden><input id="editEnabled" type="checkbox" checked>启用此账号</label><p id="userDialogError" class="form-error" role="alert" hidden></p><footer><button type="button" class="account-button" data-close-dialog="userDialog">取消</button><button id="saveUserBtn" class="account-button primary" type="submit">保存</button></footer></form></dialog>
  <dialog id="passwordDialog" class="account-dialog"><h2>重置用户密码</h2><p id="resetPasswordHint" class="secondary"></p><form id="resetPasswordForm"><label>新密码<input id="resetPasswordInput" type="password" autocomplete="new-password" minlength="10" maxlength="128" required placeholder="至少 10 个字符"></label><label class="checkbox-label"><input id="resetForceChange" type="checkbox" checked>要求用户下次登录修改密码</label><p id="resetDialogError" class="form-error" role="alert" hidden></p><footer><button type="button" class="account-button" data-close-dialog="passwordDialog">取消</button><button id="resetPasswordSubmit" type="submit" class="account-button primary">重置并结束已有会话</button></footer></form></dialog>
</body></html>
