<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · AIS数据分析与态势评估平台</title><link rel="icon" type="image/png" href="/static/assets/ais-logo.png?v=20261014-logo-3">
  <link rel="stylesheet" href="/static/account.css?v=20261014-ui-1">
  <link rel="stylesheet" href="/static/brand.css?v=20261014-logo-3">
  <link rel="stylesheet" href="/static/login.css?v=20261014-logo-3">
  <script defer src="/static/session.js?v=20261014-1"></script>
  <script defer src="/static/login.js?v=20261015-login-1"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-story" aria-label="平台介绍">
      <div class="account-brand"><span class="brand-symbol" aria-hidden="true"><img class="platform-logo" src="/static/assets/ais-logo.png?v=20261014-logo-3" alt="" width="64" height="64"></span><span>AIS数据分析与态势评估平台</span></div>
      <div class="auth-story-copy"><span class="overline">MARITIME ANALYSIS WORKSPACE</span><h1>从每一个位置，<br>看见航行的全貌。</h1></div>
    </section>
    <section class="auth-form-panel">
      <span id="authEyebrow" class="overline dark">欢迎回来</span><h2 id="authTitle">登录平台</h2><p id="authDescription" class="secondary" hidden></p>
      <form id="authForm">
        <label id="usernameField">账号<input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" required placeholder="请输入账号"></label>
        <label id="displayNameField" hidden>显示名称<input id="displayName" name="displayName" maxlength="80" placeholder="例如：平台管理员"></label>
        <label><span id="passwordLabel">密码</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="请输入密码"></label>
        <label id="newPasswordField" hidden>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="至少 10 个字符"></label>
        <label id="confirmField" hidden>确认密码<input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" placeholder="再次输入密码"></label>
        <p id="authError" class="form-error" role="alert" hidden></p>
        <button id="authSubmit" class="account-button primary" type="submit">登录平台 <span aria-hidden="true">→</span></button>
      </form>
      <p id="authHint" class="auth-hint">账号由管理员创建。忘记密码时，请联系管理员重置。</p>
      <nav class="auth-links"><a id="alternateLogin" href="/admin/login">进入用户管理后台</a><a id="returnWorkbench" href="/" hidden>返回工作台</a></nav>
    </section>
  </main>
</body>
</html>
