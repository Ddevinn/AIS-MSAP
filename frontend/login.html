<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · AIS 船舶轨迹分析</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/account.css?v=20261014-1">
  <script defer src="/static/session.js?v=20261014-1"></script>
  <script defer src="/static/login.js?v=20261014-1"></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-story" aria-label="平台介绍">
      <div class="account-brand"><span class="brand-symbol">A</span><span>AIS · 船舶轨迹分析</span></div>
      <div class="auth-story-copy"><span class="overline">MARITIME ANALYSIS WORKSPACE</span><h1>从每一个位置，<br>看见航行的全貌。</h1><p>导入船舶数据，整理轨迹，探索水域中的航行规律。<br>每个账号拥有自己的数据空间。</p></div>
      <svg class="route-art" viewBox="0 0 580 230" aria-hidden="true"><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".08"/></pattern></defs><rect width="580" height="230" fill="url(#grid)"/><path d="M-30 210C95 190 112 115 199 133S323 181 384 78S497 40 610 8" stroke="#6fe0d0" stroke-width="3" fill="none"/><path d="M-20 176C113 180 146 65 257 82S407 199 590 78" stroke="#7da1cc" stroke-opacity=".5" stroke-width="2" fill="none" stroke-dasharray="6 8"/><g fill="#e5fff6" stroke="#4cc9b7" stroke-width="4"><circle cx="110" cy="154" r="7"/><circle cx="280" cy="146" r="7"/><circle cx="407" cy="49" r="7"/></g></svg>
      <p class="auth-story-foot">数据导入 · 轨迹清洗 · 空间统计 · 行为分析</p>
    </section>
    <section class="auth-form-panel">
      <span id="authEyebrow" class="overline dark">欢迎回来</span><h2 id="authTitle">登录分析工作台</h2><p id="authDescription" class="secondary">登录后，选择历史数据或新增一个数据文件。</p>
      <form id="authForm">
        <label id="usernameField">账号<input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]+" required placeholder="请输入账号"></label>
        <label id="displayNameField" hidden>显示名称<input id="displayName" name="displayName" maxlength="80" placeholder="例如：平台管理员"></label>
        <label><span id="passwordLabel">密码</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="请输入密码"></label>
        <label id="newPasswordField" hidden>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="至少 10 个字符"></label>
        <label id="confirmField" hidden>确认密码<input id="confirmPassword" type="password" autocomplete="new-password" maxlength="128" placeholder="再次输入密码"></label>
        <p id="authError" class="form-error" role="alert" hidden></p>
        <button id="authSubmit" class="account-button primary" type="submit">登录工作台 <span aria-hidden="true">→</span></button>
      </form>
      <p id="authHint" class="auth-hint">账号由管理员创建。忘记密码时，请联系管理员重置。</p>
      <nav class="auth-links"><a id="alternateLogin" href="/admin/login">进入用户管理后台</a><a id="returnWorkbench" href="/" hidden>返回工作台</a></nav>
    </section>
  </main>
</body>
</html>
